# Victims stack for NB1: TWO WordPress sites (blog.lab, shop.lab) behind Caddy
# with TLS 1.3 and HTTP/3. Two WordPress instances (instead of an unconfigured
# Drupal) keep both sites fully installable and seedable [audit 13]. For
# publication, pin every image by @sha256 digest.
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: lab
      MARIADB_DATABASE: wp
    volumes: ["wp_db:/var/lib/mysql"]
    healthcheck:                      # wait for the DB before WordPress [audit 21]
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:                          # -> blog.lab
    image: wordpress:6.6-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: lab
      WORDPRESS_DB_NAME: wp
    volumes: ["wp_html:/var/www/html"]

  db2:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: lab
      MARIADB_DATABASE: wp2
    volumes: ["wp2_db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress2:                         # -> shop.lab
    image: wordpress:6.6-php8.3-apache
    depends_on:
      db2:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db2
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: lab
      WORDPRESS_DB_NAME: wp2
    volumes: ["wp2_html:/var/www/html"]

  caddy:
    image: caddy:2.8
    depends_on: [wordpress, wordpress2]
    ports:
      - "443:443"          # HTTPS over TCP (TLS 1.3)
      - "443:443/udp"      # HTTP/3 over QUIC (TLS 1.3)
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile"
      - "./certs:/certs"
      - "caddy_logs:/var/log/caddy"   # JSON access logs for application-level attack evidence [audit 11]

volumes:
  caddy_logs: {}
  wp_db: {}
  wp_html: {}
  wp2_db: {}
  wp2_html: {}
