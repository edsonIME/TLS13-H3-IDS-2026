# pyproject.toml — makes the pipeline installable so feature_schema.py is always
# importable by label_flows/merge/validate/evaluate on any machine (no more
# ModuleNotFoundError when you copy only some scripts) [audit 9].
#
#   cd ProjetoDataset && pip install -e .
#
# The scripts live in src/ and import each other as top-level modules, so src/ is
# added to the path via [tool.setuptools] below.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nids-encrypted-dataset"
version = "0.17.21"
description = "Encrypted-traffic NIDS dataset toolkit (HIKARI-inspired, air-gapped testbed)"
requires-python = ">=3.9"
# Ranges keep it installable; for a PUBLICATION pin exact versions in a lock file
# (pip freeze > requirements.lock) and record image digests / tool versions in the
# split provenance JSON [audit 21].
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "selenium>=4.19,<5",
]

[tool.setuptools]
# The scripts are flat modules under src/; expose them as importable modules.
py-modules = [
    "versions", "feature_schema", "campaign", "attack_scenarios", "provenance", "label_flows",
    "merge_and_split", "validate_dataset", "evaluate_realism", "synth_nids_dataset",
    "run_attacks", "benign_traffic", "seed_content", "correlate_ground_truth",
    # lab automation layer (capture / orchestration / monitoring) -- audit v20.26
    "runlib", "clock_evidence", "capture_run", "process_pcap", "service_monitor",
    "preflight", "finalize_run", "orchestrate_run", "orchestrate_campaign",
    "verify_switch_mirroring",
]
package-dir = {"" = "src"}
